global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: ad-server
    static_configs: [{ targets: ["ad-server:8090"] }]
  - job_name: pacing-service
    static_configs: [{ targets: ["pacing-service:8095"] }]
  - job_name: audit-service
    static_configs: [{ targets: ["audit-service:8096"] }]
  - job_name: flink
    # Flink's Prometheus reporter (metrics.reporter.prom in docker-compose.yml).
    static_configs: [{ targets: ["jobmanager:9249", "taskmanager:9249"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
