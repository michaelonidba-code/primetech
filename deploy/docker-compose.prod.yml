# Hosted deployment overlay: one public entry point (Caddy, HTTPS) in front of the dashboard,
# which serves the installable app and the signed-in, read-only API. Nothing else is published:
# Kafka, Flink, Druid, the ad server and the pacing service are reachable only on the Compose
# network. See README "Hosting".
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [dashboard]
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?set DASHBOARD_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/site.d:/etc/caddy/site.d:ro # server-local additions, e.g. a www redirect
      - caddy-data:/data # certificates: keep them, or Let's Encrypt rate limits bite on redeploys
      - caddy-config:/config
      - sponsor-media:/srv/media:ro # sponsor videos + creatives.json, served at /media

  dashboard:
    restart: unless-stopped
    environment:
      NUXT_AUTH_DISABLED: "false"
      NUXT_AUTH_USERS: ${DASHBOARD_USERS:?set DASHBOARD_USERS in deploy/.env}
      NUXT_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?set DASHBOARD_SESSION_SECRET in deploy/.env}
      NUXT_TRUST_PROXY: "true"
      NUXT_ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?set ALERT_WEBHOOK_TOKEN in deploy/.env}
      NUXT_VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@${DASHBOARD_DOMAIN}}
    ports: !reset []
    volumes:
      - sponsor-catalog:/app/catalog # catalog.json for the ad server
      - sponsor-media:/app/media # uploaded sponsor videos + creatives.json

  alertmanager:
    environment:
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?set ALERT_WEBHOOK_TOKEN in deploy/.env}
    ports: !reset []

  grafana:
    environment:
      # No anonymous access in production; reach Grafana through an SSH tunnel (see README).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
    ports: !reset []

  # Internal only in production.
  redpanda:
    ports: !reset []
  console:
    ports: !reset []
  gateway:
    ports: !reset []
    environment:
      # Only the publisher site's sponsor tag may send events from a browser.
      CORS_ORIGIN: ${SPONSOR_SITE_ORIGIN:-https://1world1dollar.com}
  jobmanager:
    ports: !reset []
  router:
    ports: !reset []
  ad-server:
    ports: !reset []
    restart: unless-stopped
    # Start after the dashboard so the shared catalog volume is created with its (writable) ownership.
    depends_on:
      dashboard:
        condition: service_started
    environment:
      # No mock bidders in production: only real demand, the sponsor campaigns approved in the dashboard.
      DSP_ENDPOINTS: ""
      CATALOG_FILE: /catalog/catalog.json
      # Sponsors enter every auction until the pacing service steers them; budgets still stop them.
      DIRECT_PARTICIPATION: "1.0"
      CORS_ORIGIN: ${SPONSOR_SITE_ORIGIN:-https://1world1dollar.com}
    volumes:
      - sponsor-catalog:/catalog:ro
  pacing-service:
    ports: !reset []
  audit-service:
    ports: !reset []
  prometheus:
    ports: !reset []

  # The traffic simulator and the three mock DSPs exist for local development and load tests. In
  # production they would fill the dashboards with made-up viewers and advertisers, so they only
  # start if you ask for them: add `--profile simulation` to the compose command.
  simulator:
    profiles: [simulation]
  dsp-premium:
    profiles: [simulation]
  dsp-budget:
    profiles: [simulation]
  dsp-slow:
    profiles: [simulation]

volumes:
  caddy-data:
  caddy-config:
  sponsor-catalog:
  sponsor-media:
