name: ads-eventing

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API for tools on the host
      - "9644:9644"     # admin API and Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["bash", "/create-topics.sh"]
    volumes:
      - ./infra/create-topics.sh:/create-topics.sh:ro
    restart: "no"

  console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"

  gateway:
    build:
      context: .
      target: gateway
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      DEVICE_ID_SECRET: ${DEVICE_ID_SECRET:-local-dev-secret-change-me}
      # A fixed heap: ZGC otherwise grows towards MaxRAMPercentage of the whole host.
      JAVA_OPTS: -Xms1g -Xmx1g -XX:+UseZGC -XX:+ZGenerational
    ports:
      - "8080:8080"

  # --- Ad serving: the ad server runs an OpenRTB auction across three mock DSPs ------------------
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]

  dsp-premium: &dsp
    build:
      context: .
      target: mock-dsp
    environment:
      DSP_PROFILE: premium
      PUBLIC_URL: http://dsp-premium:9000
      JAVA_OPTS: -Xmx192m -XX:+UseZGC -XX:+ZGenerational

  dsp-budget:
    <<: *dsp
    environment:
      DSP_PROFILE: budget
      PUBLIC_URL: http://dsp-budget:9000
      JAVA_OPTS: -Xmx192m -XX:+UseZGC -XX:+ZGenerational

  dsp-slow:
    <<: *dsp
    environment:
      DSP_PROFILE: slow
      PUBLIC_URL: http://dsp-slow:9000
      JAVA_OPTS: -Xmx192m -XX:+UseZGC -XX:+ZGenerational

  ad-server:
    build:
      context: .
      target: ad-server
    depends_on:
      topics:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      REDIS_URL: redis://redis:6379
      # Must match the gateway's, so frequency caps and event reporting see the same device ids.
      DEVICE_ID_SECRET: ${DEVICE_ID_SECRET:-local-dev-secret-change-me}
      DSP_ENDPOINTS: premium-dsp=http://dsp-premium:9000/openrtb2/bid,budget-dsp=http://dsp-budget:9000/openrtb2/bid,slow-dsp=http://dsp-slow:9000/openrtb2/bid
      TMAX_MS: ${TMAX_MS:-120}
      FLOOR_CPM: ${FLOOR_CPM:-5.00}
      AUCTION_TYPE: ${AUCTION_TYPE:-first}
      JAVA_OPTS: -Xms512m -Xmx512m -XX:+UseZGC -XX:+ZGenerational
    ports:
      - "8090:8090"

  simulator:
    build:
      context: .
      target: simulator
    depends_on:
      - gateway
      - ad-server
    environment:
      GATEWAY_URL: http://gateway:8080
      # Every ad break asks the ad server for its ads, like a real player.
      AD_SERVER_URL: http://ad-server:8090
      TARGET_EPS: ${TARGET_EPS:-2000}
      DURATION_SECONDS: ${DURATION_SECONDS:-0}
      CONCURRENCY: ${CONCURRENCY:-16}
      # Event ids derive from the seed: reusing one replays ids the pipeline will de-duplicate.
      SEED: ${SEED:-42}
      # Holds every active session's plan: ~225k sessions at 50k events/s.
      JAVA_OPTS: -Xms2g -Xmx2g -XX:+UseZGC -XX:+ZGenerational

  # Flink in application mode: the job manager runs PipelineJob from the image's usrlib.
  jobmanager:
    build:
      context: .
      target: stream-processor
    command: standalone-job --job-classname dev.primetech.ads.stream.PipelineJob
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      FLINK_PROPERTIES: &flink-properties |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 4
        state.backend.type: rocksdb
        execution.checkpointing.incremental: true
        execution.checkpointing.dir: file:///flink-data/checkpoints
        execution.checkpointing.savepoint-dir: file:///flink-data/savepoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        jobmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 3072m
        taskmanager.memory.managed.fraction: 0.3
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    ports:
      - "8082:8081"   # Flink web UI and REST API
    volumes:
      - flink-data:/flink-data
    restart: unless-stopped

  taskmanager:
    build:
      context: .
      target: stream-processor
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-data:/flink-data
    restart: unless-stopped

  # --- Druid: real-time OLAP over ad-events-clean.v1 -------------------------------------------
  # Kafka ingestion rolls events up to one row per minute and dimension combination.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid-local-only
      POSTGRES_DB: druid
    volumes:
      - druid-metadata:/var/lib/postgresql/data

  zookeeper:
    image: zookeeper:3.9.6
    environment:
      ZOO_MY_ID: 1

  coordinator:
    image: apache/druid:37.0.0
    command: coordinator
    depends_on: [postgres, zookeeper]
    env_file: infra/druid/druid.env
    environment:
      DRUID_XMX: 384m
      DRUID_XMS: 384m
    volumes:
      - druid-shared:/opt/shared

  broker:
    image: apache/druid:37.0.0
    command: broker
    depends_on: [coordinator]
    env_file: infra/druid/druid.env
    environment:
      DRUID_XMX: 512m
      DRUID_XMS: 512m
      DRUID_MAXDIRECTMEMORYSIZE: 384m

  historical:
    image: apache/druid:37.0.0
    command: historical
    depends_on: [coordinator]
    env_file: infra/druid/druid.env
    environment:
      DRUID_XMX: 512m
      DRUID_XMS: 512m
      DRUID_MAXDIRECTMEMORYSIZE: 384m
    volumes:
      - druid-shared:/opt/shared

  middlemanager:
    image: apache/druid:37.0.0
    command: middleManager
    depends_on: [coordinator]
    env_file: infra/druid/druid.env
    environment:
      DRUID_XMX: 128m
      DRUID_XMS: 128m
    volumes:
      - druid-shared:/opt/shared

  router:
    image: apache/druid:37.0.0
    command: router
    depends_on: [coordinator]
    env_file: infra/druid/druid.env
    environment:
      DRUID_XMX: 128m
      DRUID_XMS: 128m
    ports:
      - "8888:8888"   # Druid console and SQL API

  druid-setup:
    image: apache/druid:37.0.0
    depends_on:
      router:
        condition: service_started
      topics:
        condition: service_completed_successfully
    entrypoint: ["sh", "/specs/submit-supervisor.sh"]
    volumes:
      - ./infra/druid:/specs:ro
    restart: "no"

  dashboard:
    build:
      context: ./dashboard
    environment:
      # The browser calls the gateway directly, so this is the host-side address.
      NUXT_PUBLIC_GATEWAY_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      # Server-side routes reach these over the Compose network.
      NUXT_FLINK_URL: http://jobmanager:8081
      NUXT_DRUID_URL: http://router:8888
      NUXT_AD_SERVER_URL: http://ad-server:8090
    ports:
      - "3000:3000"

volumes:
  redpanda-data:
  flink-data:
  druid-shared:
  druid-metadata:
