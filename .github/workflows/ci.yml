name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx nuxt typecheck
      - run: npm test
      - run: npm run build
      - run: npm run generate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Validate the production overlay
        run: >
          DASHBOARD_DOMAIN=ci.example DASHBOARD_USERS=ci=x DASHBOARD_SESSION_SECRET=x
          ALERT_WEBHOOK_TOKEN=x GRAFANA_ADMIN_PASSWORD=x
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config and alert rules
        run: >
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: >
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" -w /etc/prometheus/tests --entrypoint promtool
          prom/prometheus:v3.5.0 test rules ads-eventing-test.yml
      - name: Load test scripts compile
        run: python3 -m py_compile loadtest/run.py loadtest/report.py
      - name: Alertmanager config
        run: >
          docker run --rm -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" --entrypoint amtool
          prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
