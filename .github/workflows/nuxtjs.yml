# Builds the dashboard in dashboard/ as a static site and deploys it to GitHub Pages.
# The hosted page polls whichever gateway you point it at: ?gateway=http://localhost:8080 by default.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy dashboard to Pages

on:
  push:
    branches: ["main"]
    paths: ["dashboard/**", ".github/workflows/nuxtjs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Static HTML export with Nuxt
        run: npm run generate
        env:
          # Project pages are served under /<repo>/.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # No server on Pages: the browser calls a gateway itself (?gateway=<url>).
          NUXT_PUBLIC_GATEWAY_MODE: direct
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
